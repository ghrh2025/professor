.timeline-list::before{content:'';position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:#ddd}
.week-group{position:relative;margin-bottom:.5rem}

.week-group.past::before{background:#E00122}

.week-group.future::before{background:#ccc}

 color:#999;padding:.5rem 0 .4rem}
.week-group.current .week-header{color:#E00122}
.day-cards{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-bottom:1.25rem}
.day-card{background:#fff;border-radius:10px;padding:.9rem 1rem;display:flex;flex-direction:column;
 gap:.4rem;text-decoration:none;color:inherit;transition:transform .12s,box-shadow .12s;
 border:1px solid #e8e8e8;position:relative}
.week-group.past .day-card[href],.week-group.current .day-card[href]{cursor:pointer}

.week-group.current .day-card{border-color:#f0c0c8}
.week-group.current .day-card[href]{border-color:#E00122}
.week-group.future .day-card{opacity:.4;cursor:default}
.day-card.no-class{background:#f2f2f2;opacity:.6}
.day-top{display:flex;align-items:center;justify-content:space-between}
.day-tag{font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 color:#fff;background:#bbb;padding:.2rem .5rem;border-radius:4px}
.week-group.current .day-tag{background:#E00122}
.week-group.past .day-tag{background:#999}
.day-date{font-size:.65rem;color:#aaa;font-weight:500}
.card-body{flex:1}
.card-body h3{font-size:.95rem;font-weight:600;margin-bottom:.1rem;line-height:1.3}
.card-status{font-size:.8rem}
.card-status .arrow{color:#E00122;font-size:1.1rem}
.card-status .lock{color:#bbb;font-size:.9rem}
.footer{text-align:center;padding:1.5rem 1rem 2rem;font-size:.7rem;color:#aaa;line-height:1.6}
@media (max-width:560px){

function status(dateStr){
  const now=new Date();now.setHours(0,0,0,0);
  const d=new Date(dateStr+"T00:00:00");
  if(now>d)return"past"; if(now.getTime()===d.getTime())return"current"; return"future";
}
function weekStatus(w){
  const a=status(w.day1.date),b=status(w.day2.date);
  if(a==="past"&&b==="past")return"past";
  if(a==="future"&&b==="future")return"future";
  return"current";
}
function renderHero(){
  const el=document.getElementById("hero");
  let day=null,wk=null,label="";
  outer: for(const w of weeks){
    for(const [k,lab] of [["day1",DAY_LABELS[0]],["day2",DAY_LABELS[1]]]){
      const d=w[k]; if(d.noClass) continue;
      const s=status(d.date);
      if(s==="current"||s==="future"){day=d;wk=w;label=lab;break outer;}
    }
  }
  if(!day){
    el.innerHTML='<div class="hero-card no-active" style="margin-top:1.25rem"><div class="hero-icon">🎉</div>'+
      '<div class="hero-text"><div class="week-label">Semester Complete</div><h2>Great work this semester.</h2>'+
      '<div class="concept">All exercises are available below.</div></div></div>';
    return;
  }
  const today=status(day.date)==="current";
  const has=!!day.link, tag=has?"a":"div", href=has?' href="'+day.link+'"':"";
  el.innerHTML='<'+tag+' class="hero-card" style="margin-top:1.25rem"'+href+'>'+
    '<div class="hero-icon">'+wk.icon+'</div><div class="hero-text">'+
    '<div class="week-label"><span class="hero-badge">'+(today?"Today":"Up Next")+'</span> &nbsp;Week '+wk.num+' · '+label+
      (wk.chapter?' · '+wk.chapter:'')+'</div>'+
    '<h2>'+wk.case+'</h2><div class="concept">'+day.focus+'</div></div>'+
    (has?'<div class="hero-arrow">→</div>':'<div class="hero-arrow" style="color:#bbb;font-size:.75rem">Coming soon</div>')+
    '</'+tag+'>';
}
function renderTimeline(){
  document.getElementById("timeline").innerHTML=weeks.map(w=>{
    const ws=weekStatus(w);
    const card=(d,label)=>{
      if(d.noClass) return '<div class="day-card no-class"><div class="day-top"><span class="day-tag">'+label+
        '</span><span class="day-date">'+fmt(d.date)+'</span></div><div class="card-body"><h3>'+d.focus+
        '</h3></div><div class="card-status"></div></div>';
      const open=ws!=="future", has=d.link&&open, tag=has?"a":"div", href=has?' href="'+d.link+'"':"";
      const st=!open?'<span class="lock">🔒</span>':(has?'<span class="arrow">→</span>':'');
      return '<'+tag+' class="day-card"'+href+'><div class="day-top"><span class="day-tag">'+label+
        '</span><span class="day-date">'+fmt(d.date)+'</span></div><div class="card-body"><h3>'+d.focus+
        '</h3></div><div class="card-status">'+st+'</div></'+tag+'>';
    };
    const title='Week '+w.num+(w.chapter?' · '+w.chapter:'')+(w.framework?' · '+w.framework:'')+' — '+w.case;
    return '<li class="week-group '+ws+'"><div class="week-header">'+title+'</div>'+
      '<div class="day-cards">'+card(w.day1,DAY_LABELS[0])+card(w.day2,DAY_LABELS[1])+'</div></li>';
  }).join("");
}
function fmt(s){return new Date(s+"T00:00:00").toLocaleDateString('en-US',{month:'short',day:'numeric'});}
